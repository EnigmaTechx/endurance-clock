<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endurance Clock</title>
  <meta name="description" content="A web clock themed on the Endurance from Interstellar. Twelve ring modules mark the hours; the hands sweep in real local time.">
  <meta name="theme-color" content="#04060c">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Endurance">
  <link rel="canonical" href="https://clock.enigmatech.dev/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Endurance Clock">
  <meta property="og:title" content="Endurance Clock">
  <meta property="og:description" content="A web clock themed on the Endurance from Interstellar. Twelve ring modules mark the hours; the hands sweep in real local time.">
  <meta property="og:url" content="https://clock.enigmatech.dev/">
  <meta property="og:image" content="https://clock.enigmatech.dev/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Endurance ring from Interstellar drawn as a clock face, with Gargantua behind it.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Endurance Clock">
  <meta name="twitter:description" content="A web clock themed on the Endurance from Interstellar. Twelve ring modules mark the hours; the hands sweep in real local time.">
  <meta name="twitter:image" content="https://clock.enigmatech.dev/assets/og.png">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/endurance-clock.css">
</head>
<body>
  <div class="starfield-wrap" aria-hidden="true">
    <canvas id="starfield" class="starfield"></canvas>
  </div>

  <nav class="site-nav" aria-label="Clock versions">
    <span class="site-nav__brand">Endurance</span>
    <span class="site-nav__links">
      <span aria-current="page">2D</span>
      <a href="3d/">3D</a>
      <button type="button" id="tilt-enable" class="site-nav__mode" hidden
              title="Allow motion access so the clock responds to tilting the phone">Tilt</button>
      <button type="button" id="tick-toggle" class="site-nav__mode" aria-pressed="false"
              title="A quiet tick on every second">Tick</button>
    </span>
  </nav>

  <p id="site-hint" class="site-hint" role="status" hidden></p>

  <main class="stage">
    <div class="endurance-clock" data-endurance-clock></div>
  </main>

  <script src="js/starfield.js"></script>
  <script src="js/endurance-clock.js"></script>
  <script src="js/parallax.js"></script>
  <script src="js/daylight.js"></script>
  <script src="js/tick.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
